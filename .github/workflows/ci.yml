name: CI

# Runs on pull requests and feature branches. Pushes to main run the same job
# through release.yml, so every release is built from a tested commit.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build card and demo
        run: npm run build:demo

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload card bundle
        uses: actions/upload-artifact@v7
        with:
          name: ha-light-control
          path: dist/ha-light-control.js
          if-no-files-found: error
