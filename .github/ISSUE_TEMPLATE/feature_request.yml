name: Feature request
description: An idea that would make the card better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or annoyance first; we can work out the best feature together.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, sketches, or cards that already do something similar.
